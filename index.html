<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>

<body>
    <div class="calculator">
        <div class="top-panel">
        </div>
        <div class="field">
            <p>7</p>
        </div>
        <div class="keyboard">
            <button class="grey">AC</button>
            <button class="grey">+/-</button>
            <button class="grey">%</button>
            <button class="orange">÷</button>
            <button class="black">7</button>
            <button class="black">8</button>
            <button class="black">9</button>
            <button class="orange">×</button>
            <button class="black">4</button>
            <button class="black">5</button>
            <button class="black">6</button>
            <button class="orange">-</button>
            <button class="black">1</button>
            <button class="black">2</button>
            <button class="black">3</button>
            <button class="orange">+</button>
            <button class="black" id="zero">0</button>
            <button class="black">,</button>
            <button class="orange">=</button>
        </div>
    </div>
    <div class="card">
        <div class="first-row">
            <div class="text">
                <a href="#" class="heading">"Поколение Python": курс для начинающих
                </a>
                <span class="author">
                    <a href="#" class="author">Тимур Гуев, </a>
                    <a href="#">Поколение Python,</a><br>
                    <a href="#">Благотворительный фонд "Айкью Опшн"</a>
                </span>
            </div>
            <div class="image">
                <img src="guev.png">
            </div>
        </div>
        <div class="bottom">

        </div>
    </div>
</body>

</html>
